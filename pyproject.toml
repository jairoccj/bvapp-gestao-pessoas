[project]
name = "bvapp-gestao-pessoas"
version = "0.1.0"
description = "Mini projeto de testes e cenários BDD/TDD para o BVapp em Flask"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "selenium>=4.18.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "unidades_consumidoras",
    "operadoras_energia",
    "prestadores_servicos",
    "functional_tests"
]