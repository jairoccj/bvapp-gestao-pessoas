<!DOCTYPE html>
<html>
<head><title>Unidades Consumidoras</title></head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h1>Consulta de Unidades Consumidoras</h1>
    <table id="tabela-ucs">
        {% for uc in unidades %}
        <tr><td>{{ uc.codigo_conta }}</td><td>{{ uc.nome }}</td><td>{{ uc.status }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
