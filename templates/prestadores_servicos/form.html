<!DOCTYPE html>
<html>
<head><title>Cadastro/Edição de Prestador</title></head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h1>Cadastro de Prestador de Serviços</h1>
    <form method="POST">
        <input type="text" name="cnpj" value="{{ prestador.cnpj if prestador else '' }}">
        <input type="text" name="razao_social" value="{{ prestador.razao_social if prestador else '' }}">
        <input type="text" name="telefone" value="{{ prestador.telefone if prestador else '' }}">
        <input type="email" name="email" value="{{ prestador.email if prestador else '' }}">
        <input type="text" name="endereco" value="{{ prestador.endereco if prestador else '' }}">
        <input type="text" name="site" value="{{ prestador.site if prestador else '' }}">
        <input type="text" name="chave_pix" value="{{ prestador.chave_pix if prestador else '' }}">
        <select name="status">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
        </select>
        <button type="submit">Salvar</button>
    </form>
</body>
</html>
